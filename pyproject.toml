[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "disaster-response-env"
version = "1.0.0"
description = "Multi-agent disaster response coordination environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.0",
    "openai>=2.7.2",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "networkx==3.4.2",
    "openenv-core>=0.2.0",
]
